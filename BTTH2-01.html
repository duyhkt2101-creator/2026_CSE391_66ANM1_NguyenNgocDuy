<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Contact Form Flexbox</title>

<style>
*{
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#f5f5f5;
  padding:40px;
}

/* khung form */
.container{
  max-width:900px;
  margin:auto;
  border:2px solid #333;
  padding:30px;
  background:white;
}

h2{
  margin-bottom:20px;
  color:#555;
}

/* flex form */
.form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* hàng 2 input */
.row{
  display:flex;
  gap:15px;
}

.row input{
  flex:1;
}

/* input chung */
input, textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
}

/* textarea */
textarea{
  height:220px;
  resize:none;
}

/* footer form */
.form-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  background:#6fb6df;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:5px;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  background:#4ea3d3;
}

.note{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Get in touch with us by filling contact form below</h2>

  <form class="form">

    <div class="row">
      <input type="text" placeholder="* Enter your full name">
      <input type="email" placeholder="* Enter your email address">
    </div>

    <input type="text" placeholder="Enter your subject">

    <textarea placeholder="* Your message here..."></textarea>

    <div class="form-footer">
      <button>Send message</button>
      <span class="note">
        * Please fill all required form field, thanks!
      </span>
    </div>

  </form>
</div>

</body>
</html>
